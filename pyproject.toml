[project]
name = "bit2me-cli-utilities"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José María Sola Durán", email = "josemaria.sola.duran@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datetime>=5.5",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "pydash>=8.0.5",
    "typer[all]>=0.16.0",
]


[project.scripts]
cli = "bit2me_cli_utilities.main:app"

[tool.taskipy.tasks]
start = "fastapi dev src/crypto_trailing_stop/main.py --app app"
test = "pytest -x --log-cli-level=INFO"
lint = "pre-commit install && pre-commit run --all"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-httpserver>=1.1.3",
    "ruff>=0.11.12",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
